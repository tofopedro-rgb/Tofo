<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tintim: A Fuga do Térreo</title>
<style>
  html, body { margin: 0; height: 100%; background: #14121a; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #87c6ff; image-rendering: auto; max-width: 100vw; max-height: 100vh;
    aspect-ratio: 16 / 9; width: 100vw; height: auto; touch-action: none; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: rgba(20,18,26,.88); text-align: center; padding: 16px; }
  .screen.hidden { display: none; }
  .screen img { width: min(220px, 40vw); border-radius: 18px; border: 4px solid #ff7a1a;
    box-shadow: 0 10px 40px rgba(255,122,26,.35); }
  .screen h1 { margin: 0; font-size: clamp(28px, 6vw, 54px); color: #ff8a2a; letter-spacing: .5px; }
  .screen p { margin: 0; max-width: 560px; line-height: 1.45; color: #e8e2f0; }
  .screen button { font: inherit; font-size: 20px; font-weight: 700; padding: 12px 28px; border: 0;
    border-radius: 999px; background: #ff7a1a; color: #fff; cursor: pointer; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; font-size: 15px; color: #cfc7da; }
  #touch { position: fixed; inset: auto 0 12px 0; display: none; justify-content: space-between; padding: 0 16px;
    pointer-events: none; }
  #touch .grp { display: flex; gap: 12px; }
  #touch button { pointer-events: auto; width: 72px; height: 72px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.28); color: #fff; font-size: 30px; touch-action: none; user-select: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>

<div id="title" class="screen">
  <img src="assets/tintim-foto.jpg" alt="Tintim">
  <h1>Tintim: A Fuga do Térreo</h1>
  <p>Ajude o Tintim a atravessar o térreo do prédio até o parquinho e derrotar a dupla mais chatinha do bairro: <b>os dois Pugs</b>!</p>
  <div class="legend">
    <span>🍪 Biscoito: pontos</span><span>🍌 Banana: corre mais rápido</span><span>🐒 Macaco: invencível</span>
  </div>
  <p style="font-size:14px;color:#a99fb8">← → ou A/D para andar · Espaço/↑/W para pular · No celular use os botões</p>
  <button id="start">Jogar</button>
</div>

<div id="end" class="screen hidden">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <button id="again">Jogar de novo</button>
</div>

<div id="touch">
  <div class="grp"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="grp"><button data-k="jump">⤒</button></div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 452;
const GRAV = 2300, JUMP_V = -860, RUN = 290, FAST = 440;

// ---------------- Input ----------------
const keys = { left: false, right: false, jump: false };
let jumpPressed = false;
const keyMap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'jump', ArrowUp: 'jump', KeyW: 'jump' };
addEventListener('keydown', e => {
  const k = keyMap[e.code]; if (!k) { if (e.code === 'Enter' && state !== 'play') start(); return; }
  e.preventDefault(); if (k === 'jump' && !keys.jump) jumpPressed = true; keys[k] = true;
});
addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) keys[k] = false; });
const touch = document.getElementById('touch');
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) touch.style.display = 'flex';
touch.querySelectorAll('button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (k === 'jump' && !keys.jump) jumpPressed = true; keys[k] = true; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => keys[k] = false));
});

// ---------------- Audio (bips simples) ----------------
let actx = null;
function beep(freq, dur = 0.1, type = 'square', vol = 0.06, slide = 0) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (_) {}
}
const sfx = {
  jump: () => beep(420, 0.15, 'square', 0.05, 380),
  cookie: () => { beep(880, 0.07, 'triangle', 0.08); setTimeout(() => beep(1320, 0.09, 'triangle', 0.08), 60); },
  power: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'triangle', 0.08), i * 70)),
  stomp: () => beep(220, 0.18, 'square', 0.07, -150),
  hurt: () => beep(200, 0.3, 'sawtooth', 0.06, -140),
  bark: () => { beep(330, 0.08, 'sawtooth', 0.07, 120); setTimeout(() => beep(300, 0.1, 'sawtooth', 0.07, 80), 120); },
  win: () => [523, 659, 784, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.09), i * 140)),
};

// ---------------- Level ----------------
const LEVEL_END = 7000, ARENA_X = 6040;
const grounds = [ [0, 1250], [1400, 1000], [2520, 820], [3480, 1100], [4740, 2260] ];
const plats = [
  [520, 340, 160], [820, 270, 140], [1180, 330, 150], [1700, 330, 180], [1960, 250, 140],
  [2380, 330, 160], [2850, 320, 140], [3100, 240, 160], [3330, 330, 120], [3800, 320, 200],
  [4150, 250, 160], [4400, 330, 150], [4620, 300, 120], [5150, 320, 180], [5480, 250, 140],
];
function makeItems() {
  const it = [];
  const cookie = (x, y) => it.push({ type: 'cookie', x, y, got: false });
  [300, 360, 420].forEach(x => cookie(x, GROUND - 40));
  [560, 600, 640].forEach(x => cookie(x, 300));
  cookie(890, 230); cookie(1225, 290);
  for (let x = 1290; x <= 1370; x += 40) cookie(x, 330);
  [1740, 1790, 1840].forEach(x => cookie(x, 290));
  cookie(2030, 210); cookie(2430, 290);
  for (let x = 2620; x <= 2820; x += 50) cookie(x, GROUND - 40);
  [3140, 3190, 3240].forEach(x => cookie(x, 200));
  [3870, 3920, 3970].forEach(x => cookie(x, 280));
  cookie(4220, 210); cookie(4680, 260);
  for (let x = 4850; x <= 5050; x += 50) cookie(x, GROUND - 40);
  [5520, 5570].forEach(x => cookie(x, 210));
  it.push({ type: 'banana', x: 2010, y: 205, got: false });
  it.push({ type: 'monkey', x: 4220, y: 170, got: false });
  it.push({ type: 'banana', x: 5550, y: 160, got: false });
  return it;
}
function makeEnemies() {
  // Pombos do térreo: andam de um lado pro outro, pisa neles!
  return [[900, 700, 1150], [1600, 1450, 2300], [2700, 2560, 3300], [3700, 3520, 4500], [4300, 4150, 4300],
    [5000, 4800, 5900]]
    .map(([x, a, b]) => ({ x, y: GROUND - 30, w: 38, h: 30, a, b, dir: -1, alive: true, t: Math.random() * 6, dy: 0 }));
}

// ---------------- State ----------------
let state = 'title', player, items, enemies, pugs, camX, time, cookies, particles, arena, shake, banner;
function reset() {
  player = { x: 120, y: GROUND - 60, w: 54, h: 50, vx: 0, vy: 0, onGround: false, face: 1, hp: 3,
    inv: 0, fast: 0, mega: 0, safeX: 120, coyote: 0, buffer: 0, landT: 0 };
  items = makeItems(); enemies = makeEnemies(); camX = 0; time = 0; cookies = 0; particles = [];
  arena = false; shake = 0; banner = { text: 'Rumo ao parquinho!', t: 2.2 };
  pugs = [
    { name: 'Pug 1', x: ARENA_X + 640, y: GROUND - 56, w: 74, h: 56, vx: 0, vy: 0, dir: -1, hp: 3, stun: 0, cd: 1.2, hurt: 0, tint: '#d9b07c' },
    { name: 'Pug 2', x: ARENA_X + 780, y: GROUND - 56, w: 74, h: 56, vx: 0, vy: 0, dir: -1, hp: 3, stun: 0, cd: 2.4, hurt: 0, tint: '#c99c66' },
  ];
}

function solids() {
  const s = [];
  for (const [x, w] of grounds) s.push({ x, y: GROUND, w, h: 200, oneWay: false });
  for (const [x, y, w] of plats) s.push({ x, y, w, h: 18, oneWay: true });
  return s;
}
const SOLIDS = solids();
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function burst(x, y, color, n = 10, spd = 260) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.6 + Math.random() * 0.4, color, r: 3 + Math.random() * 4 });
  }
}

function hurt() {
  if (player.inv > 0 || player.mega > 0) return;
  player.hp--; player.inv = 1.6; shake = 0.3; sfx.hurt();
  player.vy = -500; player.vx = -player.face * 260;
  if (player.hp <= 0) endGame(false);
}

// ---------------- Update ----------------
function update(dt) {
  time += dt;
  const p = player;
  p.inv = Math.max(0, p.inv - dt); p.fast = Math.max(0, p.fast - dt); p.mega = Math.max(0, p.mega - dt);
  if (banner.t > 0) banner.t -= dt;

  const speed = p.fast > 0 || p.mega > 0 ? FAST : RUN;
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const target = dir * speed;
  const accel = p.onGround ? 2600 : 1600;
  if (p.vx < target) p.vx = Math.min(target, p.vx + accel * dt);
  else if (p.vx > target) p.vx = Math.max(target, p.vx - accel * dt);
  if (dir) p.face = dir;

  p.coyote = p.onGround ? 0.1 : Math.max(0, p.coyote - dt);
  p.buffer = jumpPressed ? 0.12 : Math.max(0, p.buffer - dt);
  jumpPressed = false;
  if (p.buffer > 0 && p.coyote > 0) { p.vy = JUMP_V; p.coyote = 0; p.buffer = 0; p.onGround = false; sfx.jump(); }
  if (!keys.jump && p.vy < -300) p.vy += GRAV * 1.4 * dt; // pulo variável
  p.vy = Math.min(p.vy + GRAV * dt, 1200);

  // horizontal
  p.x += p.vx * dt;
  const minX = arena ? ARENA_X + 4 : 0;
  p.x = Math.max(minX, Math.min(LEVEL_END - p.w - 4, p.x));
  for (const s of SOLIDS) if (!s.oneWay && overlap(p, s)) { if (p.vx > 0) p.x = s.x - p.w; else if (p.vx < 0) p.x = s.x + s.w; }
  // vertical
  const prevBottom = p.y + p.h;
  p.y += p.vy * dt;
  const wasGround = p.onGround; p.onGround = false;
  for (const s of SOLIDS) {
    if (!overlap(p, s)) continue;
    if (s.oneWay) { if (p.vy >= 0 && prevBottom <= s.y + 2) { p.y = s.y - p.h; p.vy = 0; p.onGround = true; } }
    else if (p.vy >= 0) { p.y = s.y - p.h; p.vy = 0; p.onGround = true; }
    else { p.y = s.y + s.h; p.vy = 0; }
  }
  if (p.onGround && !wasGround) { p.landT = 0.18; burst(p.x + p.w / 2, p.y + p.h, '#d7c3a3', 6, 140); }
  p.landT = Math.max(0, p.landT - dt);
  if (p.onGround && p.y + p.h >= GROUND - 1) p.safeX = p.x;

  // caiu no buraco
  if (p.y > H + 80) {
    p.hp--; sfx.hurt(); shake = 0.3;
    if (p.hp <= 0) return endGame(false);
    Object.assign(p, { x: p.safeX - 40 * p.face, y: GROUND - 160, vx: 0, vy: 0, inv: 1.6 });
  }

  // itens
  for (const it of items) {
    if (it.got) continue;
    const box = { x: it.x - 18, y: it.y - 18 + Math.sin(time * 4 + it.x) * 4, w: 36, h: 36 };
    if (!overlap(p, box)) continue;
    it.got = true;
    if (it.type === 'cookie') { cookies++; sfx.cookie(); burst(it.x, it.y, '#e2a55a', 8, 160); }
    if (it.type === 'banana') { p.fast = 7; sfx.power(); burst(it.x, it.y, '#ffe14d', 18); banner = { text: 'Banana de pelúcia! Turbo!', t: 1.8 }; }
    if (it.type === 'monkey') { p.mega = 8; p.hp = Math.min(3, p.hp + 1); sfx.power(); burst(it.x, it.y, '#ff9a3c', 24); banner = { text: 'Macaco de pelúcia! Invencível!', t: 1.8 }; }
  }

  // pombos
  for (const e of enemies) {
    if (!e.alive) { e.dy += GRAV * dt; e.y += e.dy * dt; continue; }
    e.t += dt; e.x += e.dir * 70 * dt;
    if (e.x < e.a) { e.x = e.a; e.dir = 1; } if (e.x > e.b) { e.x = e.b; e.dir = -1; }
    if (!overlap(p, e)) continue;
    if (p.mega > 0 || (p.vy > 0 && prevBottom <= e.y + 14)) {
      e.alive = false; e.dy = -400; sfx.stomp(); burst(e.x + e.w / 2, e.y, '#9aa3b5', 12);
      if (p.mega <= 0) p.vy = -560;
    } else hurt();
  }

  // arena dos pugs
  if (!arena && p.x > ARENA_X + 120) { arena = true; sfx.bark(); banner = { text: 'Chefões: OS DOIS PUGS!', t: 2.4 }; }
  if (arena) updatePugs(dt, prevBottom);

  // câmera
  const want = arena ? ARENA_X : Math.max(0, Math.min(LEVEL_END - W, p.x - W * 0.38));
  camX += (want - camX) * Math.min(1, dt * 6);
  shake = Math.max(0, shake - dt);

  for (const q of particles) { q.life -= dt; q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  particles = particles.filter(q => q.life > 0);
}

function updatePugs(dt, prevBottom) {
  const p = player;
  const alive = pugs.filter(g => g.hp > 0);
  for (const g of pugs) {
    if (g.hp <= 0) { g.vy += GRAV * dt; g.y += g.vy * dt; g.x += g.vx * dt; continue; }
    g.hurt = Math.max(0, g.hurt - dt);
    const rage = alive.length === 1 ? 1.5 : 1; // o último pug fica bravo
    if (g.stun > 0) { g.stun -= dt; g.vx *= 0.9; }
    else {
      g.cd -= dt;
      g.dir = Math.sign(p.x - g.x) || g.dir;
      const onGround = g.y + g.h >= GROUND - 0.5;
      if (g.cd <= 0 && onGround) {
        // investida com pulinho
        g.vx = g.dir * (300 + 60 * (3 - g.hp)) * rage; g.vy = Math.random() < 0.45 ? -620 : -260;
        g.cd = (1.4 + Math.random() * 1.0) / rage; sfx.bark();
      } else if (onGround) g.vx += (g.dir * 90 * rage - g.vx) * Math.min(1, dt * 3);
    }
    g.vy += GRAV * dt; g.x += g.vx * dt; g.y += g.vy * dt;
    if (g.y + g.h > GROUND) { g.y = GROUND - g.h; g.vy = 0; }
    if (g.x < ARENA_X + 10) { g.x = ARENA_X + 10; g.vx = Math.abs(g.vx); }
    if (g.x + g.w > ARENA_X + W - 10) { g.x = ARENA_X + W - 10 - g.w; g.vx = -Math.abs(g.vx); }

    const hb = { x: g.x + 6, y: g.y + 6, w: g.w - 12, h: g.h - 6 };
    if (!overlap(p, hb)) continue;
    if (g.stun <= 0.6 && p.vy > 0 && prevBottom <= g.y + 22) {
      // PISOU!
      g.hp--; g.stun = 1.1; g.hurt = 0.4; g.vx = 0; p.vy = -700; shake = 0.25;
      sfx.stomp(); burst(g.x + g.w / 2, g.y, '#f3e2c3', 16);
      if (g.hp <= 0) { g.vy = -500; g.vx = g.dir * -200; banner = { text: g.name + ' foi pra casa!', t: 1.6 }; }
    } else if (g.stun <= 0) {
      if (p.mega > 0) { g.vx = -g.dir * 400; g.vy = -300; g.stun = 0.8; sfx.stomp(); }
      else hurt();
    }
  }
  if (pugs.every(g => g.hp <= 0 && g.y > H + 100) && state === 'play') endGame(true);
}

// ---------------- Desenho ----------------
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function ell(x, y, rx, ry, color, rot = 0) { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#6fb6ff'); sky.addColorStop(0.6, '#bfe2ff'); sky.addColorStop(1, '#fde8c8');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ell(820 - camX * 0.02, 90, 46, 46, 'rgba(255,240,180,.9)');
  // nuvens
  for (let i = 0; i < 8; i++) {
    const x = ((i * 380 - camX * 0.1) % 3040 + 3040) % 3040 - 200, y = 60 + (i % 3) * 40;
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    [[0, 0, 40], [35, -12, 32], [70, 0, 36], [35, 8, 34]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(x + dx, y + dy, r * 0.8, 0, 7); ctx.fill(); });
  }
  // prédios distantes
  for (let i = 0; i < 40; i++) {
    const bw = 90 + (i * 37) % 60, bh = 140 + (i * 53) % 160;
    const x = i * 150 - camX * 0.25;
    if (x < -200 || x > W + 200) continue;
    ctx.fillStyle = i % 2 ? '#9fb3cc' : '#8ea4c0';
    ctx.fillRect(x, GROUND - 60 - bh, bw, bh + 60);
    ctx.fillStyle = 'rgba(255,255,220,.55)';
    for (let wy = GROUND - 45 - bh; wy < GROUND - 70; wy += 22) for (let wx = x + 10; wx < x + bw - 14; wx += 20) ctx.fillRect(wx, wy, 9, 12);
  }
  // muro + arbustos (térreo do prédio)
  const off = -camX * 0.6;
  ctx.fillStyle = '#e9dcc6'; ctx.fillRect(0, GROUND - 90, W, 90);
  ctx.fillStyle = '#d6c6ab'; for (let x = (off % 60) - 60; x < W; x += 60) ctx.fillRect(x, GROUND - 90, 4, 90);
  for (let i = 0; i < 60; i++) {
    const x = i * 170 + off; if (x < -100 || x > W + 100) continue;
    ell(x, GROUND - 92, 60, 34, '#5fa35a'); ell(x + 40, GROUND - 100, 44, 30, '#6db866');
    if (i % 3 === 0) { ell(x - 10, GROUND - 110, 6, 6, '#ff6fa8'); ell(x + 30, GROUND - 120, 6, 6, '#ffd84d'); }
  }
}

function drawWorld() {
  // chão
  for (const [x, w] of grounds) {
    const sx = x - camX; if (sx > W || sx + w < 0) continue;
    ctx.fillStyle = '#c98a55'; ctx.fillRect(sx, GROUND, w, H - GROUND);
    ctx.fillStyle = '#b5764a';
    for (let px = Math.ceil(x / 80) * 80; px < x + w; px += 80) ctx.fillRect(px - camX, GROUND, 3, H - GROUND);
    ctx.fillStyle = '#e3a874'; ctx.fillRect(sx, GROUND, w, 10);
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(sx, GROUND + 10, w, 4);
  }
  // plataformas (bancos/floreiras)
  for (const [x, y, w] of plats) {
    const sx = x - camX; if (sx > W || sx + w < 0) continue;
    ctx.fillStyle = 'rgba(0,0,0,.12)'; roundRect(sx + 6, y + 8, w, 18, 6); ctx.fill();
    ctx.fillStyle = '#8b5a3c'; roundRect(sx, y, w, 18, 6); ctx.fill();
    ctx.fillStyle = '#a8724e'; ctx.fillRect(sx + 4, y + 3, w - 8, 4);
  }
  // parquinho
  const ax = ARENA_X - camX;
  if (ax < W + 50) {
    ctx.fillStyle = '#f7d36b'; ctx.fillRect(ax, GROUND, W, H - GROUND);
    ctx.fillStyle = '#e8c055'; for (let i = 0; i < 30; i++) ell(ax + (i * 97) % W, GROUND + 20 + (i * 31) % 60, 10, 3, '#e8c055');
    // escorregador
    ctx.strokeStyle = '#3c78d8'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(ax + 120, GROUND); ctx.lineTo(ax + 120, GROUND - 170); ctx.moveTo(ax + 180, GROUND); ctx.lineTo(ax + 180, GROUND - 170); ctx.stroke();
    ctx.fillStyle = '#e94c4c'; ctx.beginPath(); ctx.moveTo(ax + 180, GROUND - 160); ctx.lineTo(ax + 340, GROUND); ctx.lineTo(ax + 310, GROUND); ctx.lineTo(ax + 180, GROUND - 130); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(ax + 110, GROUND - 170); ctx.lineTo(ax + 150, GROUND - 210); ctx.lineTo(ax + 190, GROUND - 170); ctx.fill();
    // balanço
    ctx.strokeStyle = '#2f9e6e'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(ax + 620, GROUND); ctx.lineTo(ax + 660, GROUND - 190); ctx.lineTo(ax + 860, GROUND - 190); ctx.lineTo(ax + 900, GROUND); ctx.stroke();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
    const sw = Math.sin(time * 1.6) * 10;
    [700, 800].forEach(sx => { ctx.beginPath(); ctx.moveTo(ax + sx, GROUND - 190); ctx.lineTo(ax + sx + sw, GROUND - 70); ctx.moveTo(ax + sx + 30, GROUND - 190); ctx.lineTo(ax + sx + 30 + sw, GROUND - 70); ctx.stroke();
      ctx.fillStyle = '#ff7a1a'; ctx.fillRect(ax + sx - 6 + sw, GROUND - 72, 42, 7); });
    // placa
    ctx.fillStyle = '#6b4226'; ctx.fillRect(ax - 70, GROUND - 120, 8, 120);
    ctx.fillStyle = '#fff6e0'; roundRect(ax - 140, GROUND - 160, 150, 50, 8); ctx.fill();
    ctx.fillStyle = '#6b4226'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center'; ctx.fillText('PARQUINHO', ax - 65, GROUND - 128);
  }
}

function drawCookie(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(time * 3 + x) * 0.15);
  ctx.fillStyle = '#c27c3a';
  [[-12, -5], [-12, 5], [12, -5], [12, 5]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(dx, dy, 7, 0, 7); ctx.fill(); });
  ctx.fillRect(-12, -5, 24, 10);
  ctx.fillStyle = '#e09a55'; ctx.fillRect(-10, -3, 20, 3);
  ctx.restore();
}
function drawBanana(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.4 + Math.sin(time * 3) * 0.1);
  ctx.fillStyle = '#ffd93b'; ctx.strokeStyle = '#c99a12'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -14, 26, Math.PI * 0.2, Math.PI * 0.85); ctx.arc(-2, -30, 32, Math.PI * 0.78, Math.PI * 0.27, true); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a3b12'; ctx.fillRect(18, -2, 6, 6);
  ell(-6, 4, 2.2, 2.6, '#222'); ell(4, 5, 2.2, 2.6, '#222');
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(-1, 8, 3, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.restore();
}
function drawMonkey(x, y) {
  ctx.save(); ctx.translate(x, y + Math.sin(time * 5) * 2);
  ctx.fillStyle = 'rgba(255,160,60,.25)'; ctx.beginPath(); ctx.arc(0, 0, 30 + Math.sin(time * 6) * 3, 0, 7); ctx.fill();
  ell(-20, -2, 9, 9, '#7a4a2a'); ell(20, -2, 9, 9, '#7a4a2a'); ell(-20, -2, 5, 5, '#e8b88a'); ell(20, -2, 5, 5, '#e8b88a');
  ell(0, 0, 19, 18, '#8a5530'); ell(0, 5, 13, 11, '#efc79b'); ell(-6, -5, 6, 6, '#efc79b'); ell(6, -5, 6, 6, '#efc79b');
  ell(-6, -4, 2.6, 3, '#1c1c1c'); ell(6, -4, 2.6, 3, '#1c1c1c');
  ctx.strokeStyle = '#5a3417'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 6, 5, 0.3, Math.PI - 0.3); ctx.stroke();
  ctx.restore();
}

function drawPigeon(e) {
  const x = e.x - camX, y = e.y;
  if (x < -60 || x > W + 60) return;
  ctx.save(); ctx.translate(x + e.w / 2, y + e.h / 2); ctx.scale(e.dir, 1);
  if (!e.alive) ctx.rotate(Math.PI);
  const bob = Math.sin(e.t * 12) * 2;
  ell(0, 4, 18, 12, '#8d96a8'); ell(-4, 4, 12, 7, '#737c90');
  ell(12, -8 + bob, 9, 9, '#9aa3b5'); ell(16, -9 + bob, 2, 2, '#111');
  ctx.fillStyle = '#f0a040'; ctx.beginPath(); ctx.moveTo(20, -7 + bob); ctx.lineTo(27, -5 + bob); ctx.lineTo(20, -3 + bob); ctx.fill();
  ell(10, -1, 6, 3, '#6fbf8a');
  ctx.strokeStyle = '#e07a3a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-3, 14); ctx.lineTo(-3 + Math.sin(e.t * 12) * 3, 19); ctx.moveTo(5, 14); ctx.lineTo(5 - Math.sin(e.t * 12) * 3, 19); ctx.stroke();
  ctx.restore();
}

// Tintim desenhado em camadas de "pelo": branco com mancha preta no rosto, bandana laranja e lacinho vermelho
function drawTintim() {
  const p = player;
  if (p.inv > 0 && Math.floor(time * 20) % 2) return;
  const x = p.x - camX + p.w / 2, y = p.y + p.h;
  const moving = Math.abs(p.vx) > 20 && p.onGround;
  const run = moving ? time * (p.fast > 0 || p.mega > 0 ? 22 : 16) : 0;
  const squash = p.landT > 0 ? 1 - p.landT * 0.8 : (!p.onGround ? 1.06 : 1 + Math.sin(time * 3) * 0.015);
  ctx.save(); ctx.translate(x, y);
  ell(0, 2, 30, 6, 'rgba(0,0,0,.18)');
  ctx.scale(p.face * (2 - squash), squash);
  if (p.mega > 0) { ctx.fillStyle = `hsla(${(time * 300) % 360},100%,60%,.35)`; ctx.beginPath(); ctx.arc(0, -30, 46, 0, 7); ctx.fill(); }
  // patinhas
  const legs = [[-18, 0], [-8, Math.PI], [8, Math.PI / 2], [18, Math.PI * 1.5]];
  for (const [lx, ph] of legs) {
    const lift = moving ? Math.max(0, Math.sin(run + ph)) * 6 : (!p.onGround ? 4 : 0);
    const sw = moving ? Math.cos(run + ph) * 4 : 0;
    ctx.fillStyle = '#f2f2f2'; roundRect(lx - 5 + sw, -16 - lift, 10, 16, 4); ctx.fill();
    ell(lx + sw, -1 - lift, 6, 3.5, '#3a3a3a');
  }
  // rabo de pluma
  const wag = Math.sin(time * (moving ? 18 : 8)) * 0.18;
  ctx.save(); ctx.translate(-22, -34); ctx.rotate(-0.5 + wag);
  ell(-4, -12, 20, 15, '#e9e9ee'); ell(-10, -16, 14, 11, '#ffffff'); ell(0, -20, 12, 8, '#6a6a72'); ell(4, -22, 8, 5, '#3b3b42');
  ctx.restore();
  // corpo fofo
  ell(0, -28, 31, 22, '#eeeeF2');
  for (let i = 0; i < 9; i++) { const a = Math.PI + i * Math.PI / 8; ell(Math.cos(a) * 28, -28 + Math.sin(a) * 19, 8, 7, '#ffffff'); }
  ell(-14, -38, 12, 7, '#4a4a52'); // mancha preta das costas
  ell(4, -18, 22, 11, '#ffffff');
  // cabeça
  ctx.save(); ctx.translate(18, -48 + (moving ? Math.sin(run * 2) * 1.5 : 0));
  // orelhas
  ctx.fillStyle = '#1d1d22'; ctx.beginPath(); ctx.moveTo(-14, -12); ctx.lineTo(-10, -30); ctx.lineTo(0, -16); ctx.fill();
  ctx.fillStyle = '#25252b'; ctx.beginPath(); ctx.moveTo(2, -16); ctx.lineTo(12, -31); ctx.lineTo(16, -12); ctx.fill();
  ell(0, 0, 21, 19, '#f7f7fa');
  // mancha preta (lado direito do rosto do Tintim)
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 21, 19, 0, 0, 7); ctx.clip();
  ell(14, -6, 14, 22, '#1d1d22'); ctx.restore();
  for (let i = 0; i < 7; i++) { const a = Math.PI * 0.55 + i * 0.3; ell(Math.cos(a) * 20, Math.sin(a) * 18, 6, 5, '#ffffff'); }
  // focinho
  ell(16, 6, 10, 7, '#fbfbfd'); ell(24, 3, 4.2, 3.4, '#141416');
  // olhos
  ell(3, -3, 3.6, 4, '#111'); ell(4, -4.4, 1.2, 1.2, '#fff');
  ell(14, -4, 3.2, 3.6, '#000'); ell(15, -5.2, 1, 1, '#fff');
  // boquinha + língua
  ctx.fillStyle = '#ff7f9b'; ctx.beginPath(); ctx.ellipse(16, 13, 4, 5 + Math.sin(time * 9) * 0.8, 0, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(10, 10); ctx.quadraticCurveTo(16, 14, 22, 9); ctx.stroke();
  // lacinho vermelho + enfeite laranja
  ctx.fillStyle = '#e8202a'; ctx.beginPath(); ctx.moveTo(-6, -17); ctx.lineTo(-12, -22); ctx.lineTo(-12, -13); ctx.closePath(); ctx.moveTo(-6, -17); ctx.lineTo(0, -22); ctx.lineTo(0, -13); ctx.fill();
  ell(-6, -17, 2.2, 2.2, '#b5141c');
  ctx.strokeStyle = '#ff8c1a'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(5, -16, 3, 0, 7); ctx.stroke();
  ctx.restore();
  // bandana laranja de festa junina
  ctx.save(); ctx.translate(16, -30);
  ctx.fillStyle = '#ff6a14'; ctx.beginPath(); ctx.moveTo(-14, -8); ctx.lineTo(16, -8); ctx.lineTo(4 + Math.sin(time * 6) * 1.5, 16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(0, -6); ctx.lineTo(-3, 0); ctx.fill();
  ctx.fillStyle = '#20a36b'; ctx.beginPath(); ctx.moveTo(4, -2); ctx.lineTo(11, -2); ctx.lineTo(7, 5); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(1, 6, 2, 2); ctx.fillRect(9, -6, 2, 2);
  ctx.restore();
  ctx.restore();
}

function drawPug(g) {
  const x = g.x - camX + g.w / 2, y = g.y + g.h;
  if (g.hurt > 0 && Math.floor(time * 30) % 2) return;
  ctx.save(); ctx.translate(x, y);
  ell(0, 2, 34, 6, 'rgba(0,0,0,.2)');
  ctx.scale(g.dir, g.stun > 0 ? 0.82 : 1);
  if (g.hp <= 0) { ctx.rotate(Math.PI); ctx.translate(0, 40); }
  // patas
  const run = time * 14;
  [[-20, 0], [-8, 2], [10, 1], [22, 3]].forEach(([lx, ph]) => {
    const l = g.stun > 0 ? 0 : Math.max(0, Math.sin(run + ph)) * 5;
    ctx.fillStyle = g.tint; roundRect(lx - 5, -16 - l, 10, 16, 3); ctx.fill(); ell(lx, -1 - l, 5, 3, '#2b2018');
  });
  ell(0, -28, 34, 21, g.tint);
  // rabinho enrolado
  ctx.strokeStyle = g.tint; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(-32, -42, 7, 0.5, Math.PI * 1.8); ctx.stroke();
  // cabeça
  ctx.save(); ctx.translate(22, -46);
  ell(0, 0, 22, 20, g.tint);
  ell(-14, -15, 8, 6, '#2b2018', -0.6); ell(13, -16, 8, 6, '#2b2018', 0.6);
  ell(8, 8, 15, 11, '#2b2018'); // máscara
  ctx.strokeStyle = 'rgba(80,50,20,.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(2, -6, 8, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  // olhos esbugalhados (bravos)
  const ey = g.stun > 0 ? 0 : -4;
  ell(-4, ey, 6, 6, '#fff'); ell(12, ey, 6, 6, '#fff');
  if (g.stun > 0) {
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
    [[-4, ey], [12, ey]].forEach(([ex, eyy]) => { ctx.beginPath(); ctx.moveTo(ex - 3, eyy - 3); ctx.lineTo(ex + 3, eyy + 3); ctx.moveTo(ex + 3, eyy - 3); ctx.lineTo(ex - 3, eyy + 3); ctx.stroke(); });
  } else {
    ell(-2, ey, 3, 3, '#111'); ell(14, ey, 3, 3, '#111');
    ctx.strokeStyle = '#2b2018'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-10, -12); ctx.lineTo(1, -9); ctx.moveTo(6, -9); ctx.lineTo(17, -12); ctx.stroke();
  }
  ell(13, 5, 4, 3, '#111');
  ctx.fillStyle = '#fff'; ctx.fillRect(7, 13, 3, 3); ctx.fillRect(14, 13, 3, 3); // dentinhos
  ctx.restore();
  // coleira
  ctx.fillStyle = g.name === 'Pug 1' ? '#7a3cff' : '#ff3c8e'; ctx.fillRect(10, -36, 10, 18);
  ctx.restore();
  // estrelinhas de tontura
  if (g.stun > 0 && g.hp > 0) {
    for (let i = 0; i < 3; i++) {
      const a = time * 6 + i * 2.1;
      ctx.fillStyle = '#ffd23f'; ctx.font = '16px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('★', x + g.dir * 22 + Math.cos(a) * 18, y - 74 + Math.sin(a) * 6);
    }
  }
}

function drawHUD() {
  ctx.textAlign = 'left'; ctx.font = 'bold 22px system-ui';
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < player.hp ? '#ff3b5c' : 'rgba(0,0,0,.25)';
    const hx = 22 + i * 34, hy = 26;
    ctx.beginPath(); ctx.moveTo(hx + 12, hy + 20); ctx.bezierCurveTo(hx - 8, hy + 6, hx + 2, hy - 8, hx + 12, hy + 3);
    ctx.bezierCurveTo(hx + 22, hy - 8, hx + 32, hy + 6, hx + 12, hy + 20); ctx.fill();
  }
  drawCookie(150, 38);
  ctx.fillStyle = '#3a2210'; ctx.fillText('× ' + cookies, 172, 46);
  let bx = 260;
  if (player.fast > 0) { drawBanana(bx, 40); ctx.fillStyle = '#3a2210'; ctx.fillText(Math.ceil(player.fast) + 's', bx + 24, 46); bx += 90; }
  if (player.mega > 0) { drawMonkey(bx, 38); ctx.fillStyle = '#3a2210'; ctx.fillText(Math.ceil(player.mega) + 's', bx + 26, 46); }
  // barra de progresso
  if (!arena) {
    ctx.fillStyle = 'rgba(0,0,0,.18)'; roundRect(W - 230, 26, 200, 12, 6); ctx.fill();
    ctx.fillStyle = '#ff7a1a'; roundRect(W - 230, 26, 200 * Math.min(1, player.x / ARENA_X), 12, 6); ctx.fill();
    ctx.fillStyle = '#3a2210'; ctx.font = 'bold 13px system-ui'; ctx.fillText('parquinho', W - 230, 58);
  } else {
    pugs.forEach((g, i) => {
      const bx2 = W - 250, by = 22 + i * 26;
      ctx.fillStyle = '#3a2210'; ctx.font = 'bold 14px system-ui'; ctx.fillText(g.name, bx2, by + 12);
      for (let k = 0; k < 3; k++) { ctx.fillStyle = k < g.hp ? (i ? '#ff3c8e' : '#7a3cff') : 'rgba(0,0,0,.2)'; roundRect(bx2 + 60 + k * 50, by, 44, 14, 5); ctx.fill(); }
    });
  }
  if (banner.t > 0) {
    ctx.globalAlpha = Math.min(1, banner.t * 2);
    ctx.font = 'bold 34px system-ui'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillText(banner.text, W / 2 + 3, 133);
    ctx.fillStyle = '#fff'; ctx.fillText(banner.text, W / 2, 130);
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 12 * shake / 0.3, (Math.random() - 0.5) * 12 * shake / 0.3);
  drawBackground(); drawWorld();
  for (const it of items) {
    if (it.got) continue;
    const x = it.x - camX, y = it.y + Math.sin(time * 4 + it.x) * 4;
    if (x < -40 || x > W + 40) continue;
    if (it.type === 'cookie') drawCookie(x, y); else if (it.type === 'banana') drawBanana(x, y); else drawMonkey(x, y);
  }
  enemies.forEach(drawPigeon);
  if (arena || camX > ARENA_X - W) pugs.forEach(drawPug);
  drawTintim();
  for (const q of particles) { ctx.globalAlpha = Math.max(0, q.life); ell(q.x - camX, q.y, q.r, q.r, q.color); }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHUD();
}

// ---------------- Fluxo ----------------
const titleEl = document.getElementById('title'), endEl = document.getElementById('end');
function start() {
  reset(); state = 'play';
  titleEl.classList.add('hidden'); endEl.classList.add('hidden');
}
function endGame(win) {
  if (state !== 'play') return;
  state = 'end';
  if (win) sfx.win();
  setTimeout(() => {
    document.getElementById('endTitle').textContent = win ? 'Tintim venceu!' : 'Ah não!';
    document.getElementById('endText').textContent = win
      ? `Os pugs foram pra casa e o parquinho é todo do Tintim. Biscoitos coletados: ${cookies}. Tempo: ${time.toFixed(1)}s.`
      : `Os pugs ganharam dessa vez... Biscoitos coletados: ${cookies}. Tenta de novo!`;
    endEl.classList.remove('hidden');
  }, win ? 600 : 300);
}
document.getElementById('start').onclick = start;
document.getElementById('again').onclick = start;

reset();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play' || state === 'end') update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// gancho para testes automatizados
window.__tintim = { get state() { return state; }, get player() { return player; }, get pugs() { return pugs; }, keys, start };
})();
</script>
